name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Linux needs the X11/Wayland headers eframe links against.
      - name: Install GUI build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The backends are independently switchable, so a crate that only compiles
      # with every feature on is a crate whose feature flags do not work.
      - run: cargo clippy -p metascrub --no-default-features --features image -- -D warnings
      - run: cargo test --workspace

  # Dependency policy: licences, advisories, sources, duplicate versions.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked || true
      - run: cargo deny check

  # The Qt front ends (Sailfish and Ubuntu Touch) share one backend, and it holds
  # the rule that a file the core could not take apart is never written out as a
  # cleaned copy. Compile it against the real library and prove that still holds.
  # amd64 stands in for the phone: the same C ABI, the same Qt, no device needed.
  qt-phones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtdeclarative5-dev qtdeclarative5-dev-tools \
                                  gettext
      - name: Build the core for the click
        run: ./ubuntu-touch/build-ffi.sh amd64
      - name: Build the app and run the backend smoke test
        run: |
          cmake -S ubuntu-touch/metascrub -B ubuntu-touch/metascrub/build \
                -DMETASCRUB_TESTS=ON \
                -DCMAKE_INSTALL_PREFIX=ubuntu-touch/metascrub/build/install
          cmake --build ubuntu-touch/metascrub/build -j
          ./ubuntu-touch/metascrub/build/scrubber_smoke
          ./ubuntu-touch/metascrub/build/workspace_smoke
      - name: Check the interface parses
        run: qmllint ubuntu-touch/metascrub/qml/*.qml
      # A .po that no longer matches the interface silently drops translations,
      # and a corrupt one fails at msgfmt time rather than on someone's phone.
      - name: Check the translations compile and still match the interface
        run: |
          for po in ubuntu-touch/metascrub/po/*.po; do
            msgfmt --check-format --statistics -o /dev/null "$po"
          done
          ubuntu-touch/metascrub/po/from-android.py --report
      # Build the package the way the phone would read it. click validates the
      # manifest and the hooks, so a metadata mistake fails here rather than on
      # somebody's device.
      - name: Build a real .click package
        run: |
          sudo apt-get install -y click click-dev python3-gi
          ./ubuntu-touch/build-click.sh
          ls -l ubuntu-touch/metascrub/build/package/*.click
      - name: Check the click package lays out
        run: |
          cmake --install ubuntu-touch/metascrub/build
          cd ubuntu-touch/metascrub/build/install
          for f in metascrub manifest.json metascrub.apparmor metascrub.desktop \
                   metascrub-contenthub.json qml/Main.qml qml/handbook.json assets/logo.svg; do
            test -e "$f" || { echo "::error::$f missing from the click tree"; exit 1; }
          done
          python3 -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]" \
            manifest.json metascrub.apparmor metascrub-contenthub.json qml/handbook.json
      # A stripped binary still carries the absolute path of every source file
      # that can panic, including the building user's home directory. Shipping
      # that from a tool whose job is removing exactly this kind of thing would
      # be embarrassing as well as wrong, and it breaks reproducibility. The
      # first click built here held 108 of them.
      - name: Assert the shipped binary carries no build-machine paths
        run: |
          binary=ubuntu-touch/metascrub/build/install/metascrub
          leaked=$(strings "$binary" | grep -cE '/home/[^/]+/|/root/|/Users/[^/]+/' || true)
          if [ "$leaked" != "0" ]; then
            echo "::error::$leaked build-machine paths are embedded in $binary"
            strings "$binary" | grep -oE '(/home/[^/]+|/root|/Users/[^/]+)[^ ]*' | sort -u | head
            exit 1
          fi
          echo "no build-machine paths in the shipped binary"
      # The phone build must never gain the ability to send a file anywhere
      # either. On Ubuntu Touch that is enforced by the system, but only for as
      # long as nobody adds the policy group.
      - name: Assert the app asks for no network access
        run: |
          if grep -q 'networking' ubuntu-touch/metascrub/metascrub.apparmor; then
            echo "::error::the Ubuntu Touch app asked for network access"
            exit 1
          fi
          echo "the AppArmor profile requests no network access"

  # This tool must never gain the ability to send a file anywhere. Failing the
  # build is a stronger guarantee than a promise in a readme.
  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert no networking crate is reachable
        run: |
          if cargo tree -e normal --workspace \
             | grep -iE '(^|[^a-z])(reqwest|hyper|tokio|curl|ureq|isahc|surf|native-tls|rustls|openssl|socket2|mio)([^a-z]|$)'; then
            echo "::error::a networking crate entered the dependency tree"
            exit 1
          fi
          echo "no networking crates present"
