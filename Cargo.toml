[workspace]
resolver = "2"
members = [
    "crates/metascrub",
    "crates/pixelwash",
    "crates/metascrub-gui",
]

# The fuzz crate needs a nightly toolchain and a sanitizer runtime, so it is
# deliberately not part of the normal build. See crates/metascrub/fuzz/.
exclude = ["crates/metascrub/fuzz", "crates/pixelwash/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["metascrub contributors"]
repository = "https://github.com/NoxToxCipher/metascrub"
rust-version = "1.88"

[workspace.dependencies]
# Metadata removal. No dependency on anything else here, so it can be embedded
# in other applications without dragging an interface along.
metascrub = { path = "crates/metascrub" }
# Pixel-level sensor-fingerprint reduction. Separate from metascrub because it
# decodes images and metascrub deliberately never does.
pixelwash = { path = "crates/pixelwash" }

thiserror = "1"
rand = "0.8"
# Wipes buffers holding a decoded photograph, and whatever was pulled out of it,
# before the memory is handed back.
zeroize = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
# A panic in a parser reading somebody else's file should stop the process, not
# unwind through it. The interface installs a hook so this does not reach
# Windows Error Reporting.
panic = "abort"
overflow-checks = true
strip = true
