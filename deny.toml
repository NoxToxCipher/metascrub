# cargo-deny configuration — supply-chain policy gate.
# Run locally with:  cargo deny check

[advisories]
# Fail on any known security advisory in the dependency tree.
version = 2
yanked = "deny"
ignore = []

[bans]
# Flag multiple versions of the same crate (bloat / audit surface) as a warning.
multiple-versions = "warn"
wildcards = "deny"          # no "*" version requirements
# Deny known-problematic crates outright if any slip in.
deny = []

[licenses]
version = 2
# Permissive + our own GPL. Anything outside this list must be reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # Our own crates. cargo-deny matches SPDX ids exactly, so the "-or-later"
    # form must be listed explicitly; plain "GPL-3.0" does not cover it.
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[sources]
# Only crates.io is allowed as a registry source.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
