# cargo-deny configuration — supply-chain policy gate.
# Run locally with:  cargo deny check

[advisories]
# Fail on any known security advisory in the dependency tree.
version = 2
yanked = "deny"
ignore = []

[bans]
# Flag multiple versions of the same crate (bloat / audit surface) as a warning.
multiple-versions = "warn"
# No "*" version requirement on anything from a registry: that is how an
# unreviewed major version walks into the build.
wildcards = "deny"
# Our own crates are path dependencies with no version, which cargo represents
# as "*" (tox-core -> tox-sys, tox-daemon -> tox-core, metascrub-gui ->
# metascrub). They are in this repository and reviewed with it, so they are not
# the risk the rule exists for. This exempts path dependencies only; a wildcard
# on a crates.io dependency still fails the build.
allow-wildcard-paths = true
# Deny known-problematic crates outright if any slip in.
deny = []

[licenses]
version = 2
# Permissive + our own GPL. Anything outside this list must be reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # Our own crates. cargo-deny matches SPDX ids exactly, so the "-or-later"
    # form must be listed explicitly; plain "GPL-3.0" does not cover it.
    "GPL-3.0-or-later",

    # Arrived with the desktop interface (eframe/egui and the file dialog).
    # Both are permissive and GPL-compatible; listed individually rather than
    # loosening the policy, so a genuinely new licence still stops the build.
    # Boost Software License: clipboard-win, error-code.
    "BSL-1.0",
    # The bundled default fonts. SIL Open Font License and the Ubuntu font
    # licence both permit embedding and redistribution.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[sources]
# Only crates.io is allowed as a registry source.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
