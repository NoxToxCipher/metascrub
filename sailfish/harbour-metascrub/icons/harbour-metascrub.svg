<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 15 74 78" role="img" aria-label="metascrub">
  <!--
    Drawn as plain filled shapes rather than through a <mask>, because Qt's SVG
    renderer (SVG Tiny 1.2) ignores masking: the Sailfish and Ubuntu Touch apps
    both render this file, and with a mask both showed a solid teal rectangle.
    The eye is a hole in the head, cut with fill-rule="evenodd" instead, which
    QtSvg does support. Browsers draw it identically.
  -->
  <g fill="#5fb0ba">
    <circle cx="54" cy="54" r="19"/>
    <path d="M70 49 L80 46 L72 58 Z"/>
    <path d="M37 30 C29 31 23 34 19 37 C21 38 29 35 38 34 Z"/>
    <ellipse cx="54" cy="83" rx="22" ry="3.2"/>
    <path fill-rule="evenodd" d="M34 33 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0 Z
                                 M46.4 30 a3.6 3.6 0 1 0 7.2 0 a3.6 3.6 0 1 0 -7.2 0 Z"/>
  </g>
  <g stroke="#5fb0ba" stroke-width="2.6" stroke-linecap="round">
    <line x1="49" y1="70" x2="49" y2="80"/>
    <line x1="58" y1="70" x2="58" y2="80"/>
  </g>
</svg>
